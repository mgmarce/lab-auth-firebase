<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Firebase Auth</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="contenedor">
        <h1>Registro de Usuario</h1>

        <form id="form-registro">
            <label for="email-registro">Correo electrónico</label>
            <input type="email" id="email-registro" required>

            <label for="password-registro">Contraseña</label>
            <input type="password" id="password-registro" required>

            <button type="submit">Crear cuenta</button>
        </form>

        <p>
            ¿Ya tienes cuenta?
            <a href="index.html">Iniciar sesión</a>
        </p>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
